<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-success: #eaf3de;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b67;
      --text-tertiary: #9a9a96;
      --text-success: #3b6d11;
      --text-warning: #854f0b;
      --border-tertiary: rgba(0,0,0,0.12);
      --border-secondary: rgba(0,0,0,0.22);
      --border-primary: rgba(0,0,0,0.35);
      --border-success: rgba(59,109,17,0.35);
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1e1e1c;
        --bg-secondary: #2a2a28;
        --bg-success: #173404;
        --text-primary: #f0efea;
        --text-secondary: #a0a09a;
        --text-tertiary: #6b6b67;
        --text-success: #97c459;
        --text-warning: #ef9f27;
        --border-tertiary: rgba(255,255,255,0.10);
        --border-secondary: rgba(255,255,255,0.18);
        --border-primary: rgba(255,255,255,0.28);
        --border-success: rgba(151,196,89,0.35);
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 560px; margin: 0 auto; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .header h1 { font-size: 20px; font-weight: 500; }
    .header .date { font-size: 13px; color: var(--text-secondary); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .stat {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-tertiary);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }
    .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 500; }

    .habits-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }

    .habit-card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-tertiary);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .habit-card:hover { border-color: var(--border-secondary); }
    .habit-card.done { border-color: var(--border-success); background: var(--bg-success); }

    .check-circle {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--border-secondary);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
      color: var(--text-tertiary); font-size: 16px;
    }
    .habit-card.done .check-circle {
      background: var(--bg-success);
      border-color: var(--border-success);
      color: var(--text-success);
    }

    .habit-info { flex: 1; min-width: 0; }
    .habit-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
    .habit-name { font-size: 15px; font-weight: 500; }
    .habit-card.done .habit-name { color: var(--text-success); }

    .since-badge {
      font-size: 11px; padding: 2px 8px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 0.5px solid var(--border-tertiary);
      white-space: nowrap;
    }

    .habit-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }

    .days-bar { display: flex; gap: 4px; }
    .day-dot {
      width: 24px; height: 24px; border-radius: 4px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-tertiary);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--text-tertiary);
    }
    .day-dot.filled { background: var(--bg-success); border-color: var(--border-success); color: var(--text-success); }
    .day-dot.today { border: 1.5px solid var(--border-primary); font-weight: 500; color: var(--text-primary); }
    .day-dot.filled.today { border-color: var(--border-success); color: var(--text-success); }

    .streak {
      display: flex; align-items: center; gap: 4px;
      font-size: 13px; font-weight: 500;
      color: var(--text-secondary); flex-shrink: 0;
    }
    .streak.hot { color: var(--text-warning); }

    .delete-btn {
      background: none; border: none;
      color: var(--text-tertiary); cursor: pointer;
      padding: 4px; border-radius: 4px; font-size: 15px;
      display: flex; align-items: center;
      opacity: 0; transition: opacity 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .habit-card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #e24b4a; }

    .add-section {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-tertiary);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
    }
    .add-section label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 10px; }
    .add-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .add-row input {
      flex: 1; min-width: 140px; height: 38px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-secondary);
      padding: 0 12px; font-size: 14px; font-family: var(--font);
      background: var(--bg-secondary); color: var(--text-primary);
      outline: none; transition: border-color 0.15s;
    }
    .add-row input:focus { border-color: var(--border-primary); }

    .add-row select {
      height: 38px; border-radius: var(--radius-md);
      border: 0.5px solid var(--border-secondary);
      padding: 0 10px; font-size: 13px; font-family: var(--font);
      background: var(--bg-secondary); color: var(--text-primary);
      outline: none; cursor: pointer;
    }

    .add-row button {
      height: 38px; padding: 0 16px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-secondary);
      background: transparent; font-size: 14px; font-family: var(--font);
      color: var(--text-primary); cursor: pointer;
      white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
      transition: background 0.12s;
    }
    .add-row button:hover { background: var(--bg-secondary); }
    .add-row button:active { transform: scale(0.98); }

    .empty { text-align: center; padding: 2rem; color: var(--text-tertiary); font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Habit tracker</h1>
      <span class="date" id="today-date"></span>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Done today</div>
        <div class="stat-value" id="done-count">0 / 0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Best streak</div>
        <div class="stat-value" id="best-streak">— 🔥</div>
      </div>
      <div class="stat">
        <div class="stat-label">This week</div>
        <div class="stat-value" id="week-pct">0%</div>
      </div>
    </div>

    <div class="habits-list" id="habits-list"></div>

    <div class="add-section">
      <label>Add a new habit</label>
      <div class="add-row">
        <input type="text" id="new-habit" placeholder="e.g. Morning gym" />
        <select id="new-freq">
          <option value="Every day">Every day</option>
          <option value="Every 2 days">Every 2 days</option>
          <option value="Every 3 days">Every 3 days</option>
          <option value="Weekdays">Weekdays</option>
          <option value="Weekends">Weekends</option>
        </select>
        <button onclick="addHabit()">
          <i class="ti ti-plus"></i> Add
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'habit_tracker_v1';
    const DAY_LABELS = ['S','M','T','W','T','F','S'];

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return {
        habits: [
          { id: 1, name: 'Morning gym',   freq: 'Every day',    streak: 12, done: false, log: [1,1,1,1,1,0,0], lastDone: 1 },
          { id: 2, name: 'Read 20 pages', freq: 'Every day',    streak: 7,  done: false, log: [1,1,0,1,1,1,0], lastDone: 1 },
          { id: 3, name: 'Meditate',      freq: 'Every 2 days', streak: 4,  done: false, log: [1,0,1,0,1,0,1], lastDone: 2 },
          { id: 4, name: 'Cold shower',   freq: 'Every day',    streak: 3,  done: false, log: [0,1,1,1,0,0,0], lastDone: 3 },
        ]
      };
    }

    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
    }

    let data = loadData();

    function render() {
      const list = document.getElementById('habits-list');
      list.innerHTML = '';

      if (data.habits.length === 0) {
        list.innerHTML = '<div class="empty">No habits yet — add one below</div>';
      }

      let doneCount = 0;

      data.habits.forEach(h => {
        if (h.done) doneCount++;
        const card = document.createElement('div');
        card.className = 'habit-card' + (h.done ? ' done' : '');

        const dotDays = DAY_LABELS.map((d, i) => {
          const isToday = i === 6;
          const filled = h.log[i] === 1;
          return `<div class="day-dot${filled ? ' filled' : ''}${isToday ? ' today' : ''}">${d}</div>`;
        }).join('');

        const sinceText = h.lastDone === 0 ? 'Done today'
          : h.lastDone === 1 ? '1 day ago'
          : h.lastDone > 90 ? 'Not started'
          : `${h.lastDone} days ago`;

        card.innerHTML = `
          <div class="check-circle"><i class="ti ti-check"></i></div>
          <div class="habit-info">
            <div class="habit-top">
              <span class="habit-name">${h.name}</span>
              <span class="since-badge">${sinceText}</span>
            </div>
            <div class="habit-meta">${h.freq}</div>
            <div class="days-bar">${dotDays}</div>
          </div>
          <div class="streak${h.streak >= 7 ? ' hot' : ''}">
            <i class="ti ti-flame"></i> ${h.streak}
          </div>
          <button class="delete-btn" data-id="${h.id}" title="Delete habit">
            <i class="ti ti-trash"></i>
          </button>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.delete-btn')) return;
          h.done = !h.done;
          if (h.done) { h.log[6] = 1; h.streak++; h.lastDone = 0; }
          else { h.log[6] = 0; h.streak = Math.max(0, h.streak - 1); h.lastDone = 1; }
          saveData();
          render();
        });

        card.querySelector('.delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          data.habits = data.habits.filter(x => x.id !== h.id);
          saveData();
          render();
        });

        list.appendChild(card);
      });

      document.getElementById('done-count').textContent = `${doneCount} / ${data.habits.length}`;
      const totalPossible = data.habits.length * 7;
      const totalDone = data.habits.reduce((a, h) => a + h.log.filter(Boolean).length, 0);
      const pct = totalPossible > 0 ? Math.round(totalDone / totalPossible * 100) : 0;
      document.getElementById('week-pct').textContent = pct + '%';
      const best = data.habits.length > 0 ? Math.max(...data.habits.map(h => h.streak)) : 0;
      document.getElementById('best-streak').textContent = best + ' 🔥';
    }

    function addHabit() {
      const input = document.getElementById('new-habit');
      const freq = document.getElementById('new-freq');
      const name = input.value.trim();
      if (!name) { input.focus(); return; }
      data.habits.push({
        id: Date.now(), name, freq: freq.value,
        streak: 0, done: false,
        log: [0,0,0,0,0,0,0], lastDone: 99
      });
      input.value = '';
      saveData();
      render();
    }

    document.getElementById('new-habit').addEventListener('keydown', e => {
      if (e.key === 'Enter') addHabit();
    });

    document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long'
    });

    render();
  </script>
</body>
</html>
